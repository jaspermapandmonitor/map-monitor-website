<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#f0ddb8"/>
      <stop offset="35%"  stop-color="#e8ce9e"/>
      <stop offset="70%"  stop-color="#dbbe88"/>
      <stop offset="100%" stop-color="#c9aa70"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="aged" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75 0.65" numOctaves="4" seed="8" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Parchment base -->
  <rect width="1440" height="900" fill="url(#parchment)"/>
  <!-- Aged texture -->
  <rect width="1440" height="900" fill="#a07030" opacity="0.12" filter="url(#aged)"/>
  <!-- Warm wash -->
  <rect width="1440" height="900" fill="#c8902a" opacity="0.06"/>
  <!-- Vignette -->
  <rect width="1440" height="900" fill="url(#vignette)"/>

  <!-- ── Outer decorative border ── -->
  <rect x="22" y="22" width="1396" height="856" fill="none" stroke="#6b4c1e" stroke-width="2.5" opacity="0.7"/>
  <rect x="30" y="30" width="1380" height="840" fill="none" stroke="#6b4c1e" stroke-width="0.8" opacity="0.45"/>

  <!-- Corner ornaments -->
  <g fill="#6b4c1e" opacity="0.65">
    <!-- TL -->
    <circle cx="22" cy="22" r="4.5"/>
    <polygon points="22,10 24.5,19 22,17 19.5,19"/>
    <polygon points="10,22 19,24.5 17,22 19,19.5"/>
    <polygon points="22,34 24.5,25 22,27 19.5,25"/>
    <polygon points="34,22 25,24.5 27,22 25,19.5"/>
    <!-- TR -->
    <circle cx="1418" cy="22" r="4.5"/>
    <polygon points="1418,10 1420.5,19 1418,17 1415.5,19"/>
    <polygon points="1430,22 1421,24.5 1423,22 1421,19.5"/>
    <polygon points="1418,34 1420.5,25 1418,27 1415.5,25"/>
    <polygon points="1406,22 1415,24.5 1413,22 1415,19.5"/>
    <!-- BL -->
    <circle cx="22" cy="878" r="4.5"/>
    <polygon points="22,890 24.5,881 22,883 19.5,881"/>
    <polygon points="10,878 19,875.5 17,878 19,880.5"/>
    <polygon points="22,866 24.5,875 22,873 19.5,875"/>
    <polygon points="34,878 25,875.5 27,878 25,880.5"/>
    <!-- BR -->
    <circle cx="1418" cy="878" r="4.5"/>
    <polygon points="1418,890 1420.5,881 1418,883 1415.5,881"/>
    <polygon points="1430,878 1421,875.5 1423,878 1421,880.5"/>
    <polygon points="1418,866 1420.5,875 1418,873 1415.5,875"/>
    <polygon points="1406,878 1415,875.5 1413,878 1415,880.5"/>
  </g>

  <!-- ── Coordinate grid ── -->
  <g stroke="#7a5428" stroke-width="0.6" fill="none" opacity="0.4">
    <!-- Meridians every 30° (13 lines incl. edges) — 1440/12 = 120px steps -->
    <line x1="120"  y1="30" x2="120"  y2="870"/>
    <line x1="240"  y1="30" x2="240"  y2="870"/>
    <line x1="360"  y1="30" x2="360"  y2="870"/>
    <line x1="480"  y1="30" x2="480"  y2="870"/>
    <line x1="600"  y1="30" x2="600"  y2="870"/>
    <line x1="840"  y1="30" x2="840"  y2="870"/>
    <line x1="960"  y1="30" x2="960"  y2="870"/>
    <line x1="1080" y1="30" x2="1080" y2="870"/>
    <line x1="1200" y1="30" x2="1200" y2="870"/>
    <line x1="1320" y1="30" x2="1320" y2="870"/>
    <!-- Parallels every 30° — 840/6 = 140px steps, centered at y=450 -->
    <line x1="30" y1="170" x2="1410" y2="170"/>
    <line x1="30" y1="310" x2="1410" y2="310"/>
    <line x1="30" y1="590" x2="1410" y2="590"/>
    <line x1="30" y1="730" x2="1410" y2="730"/>
  </g>
  <!-- Equator and Prime Meridian bolder -->
  <line x1="30" y1="450" x2="1410" y2="450" stroke="#7a5428" stroke-width="1.4" opacity="0.55"/>
  <line x1="720" y1="30" x2="720" y2="870" stroke="#7a5428" stroke-width="1.4" opacity="0.55"/>
  <!-- Tropics (dashed) -->
  <line x1="30" y1="338" x2="1410" y2="338" stroke="#7a5428" stroke-width="0.7" stroke-dasharray="6,5" opacity="0.38"/>
  <line x1="30" y1="562" x2="1410" y2="562" stroke="#7a5428" stroke-width="0.7" stroke-dasharray="6,5" opacity="0.38"/>

  <!-- ── Map labels ── -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#5c3a12" opacity="0.55">
    <!-- Degree labels along left edge -->
    <text x="48" y="175" font-size="11">60°N</text>
    <text x="48" y="315" font-size="11">30°N</text>
    <text x="52" y="455" font-size="11">EQ.</text>
    <text x="48" y="595" font-size="11">30°S</text>
    <text x="48" y="735" font-size="11">60°S</text>
    <!-- Degree labels along bottom -->
    <text x="114"  y="858" font-size="10" text-anchor="middle">150W</text>
    <text x="234"  y="858" font-size="10" text-anchor="middle">120W</text>
    <text x="354"  y="858" font-size="10" text-anchor="middle">90W</text>
    <text x="474"  y="858" font-size="10" text-anchor="middle">60W</text>
    <text x="594"  y="858" font-size="10" text-anchor="middle">30W</text>
    <text x="720"  y="858" font-size="10" text-anchor="middle">0°</text>
    <text x="846"  y="858" font-size="10" text-anchor="middle">30E</text>
    <text x="966"  y="858" font-size="10" text-anchor="middle">60E</text>
    <text x="1086" y="858" font-size="10" text-anchor="middle">90E</text>
    <text x="1206" y="858" font-size="10" text-anchor="middle">120E</text>
    <text x="1326" y="858" font-size="10" text-anchor="middle">150E</text>
  </g>

  <!-- Decorative title -->
  <text x="720" y="72" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="18" font-style="italic" letter-spacing="8"
        fill="#5c3a12" opacity="0.45">TYPVS ORBIS TERRARVM</text>

  <!-- Ocean labels -->
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#4a3010" opacity="0.38">
    <text x="200"  y="440" font-size="22" letter-spacing="4" text-anchor="middle">OCEANUS</text>
    <text x="200"  y="465" font-size="14" letter-spacing="3" text-anchor="middle">ATLANTICUS</text>
    <text x="1150" y="420" font-size="20" letter-spacing="3" text-anchor="middle">MARE</text>
    <text x="1150" y="446" font-size="20" letter-spacing="3" text-anchor="middle">PACIFICVM</text>
    <text x="780"  y="680" font-size="16" letter-spacing="2" text-anchor="middle">MARE INDICUM</text>
  </g>

  <!-- ── Compass Rose (lower-left, out of center text area) ── -->
  <g transform="translate(210,700)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="68" fill="none" stroke="#6b4c1e" stroke-width="1.2" opacity="0.6"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="#6b4c1e" stroke-width="0.5" opacity="0.4"/>

    <!-- 16-point star: 4 long cardinal + 4 medium intercardinal + 8 short -->
    <!-- Cardinal points (long, alternating fill) -->
    <polygon points="0,-58 -7,-14 0,-22 7,-14"  fill="#4a2e0a" opacity="0.85"/>
    <polygon points="0,58  -7,14  0,22  7,14"   fill="#8b6428" opacity="0.85"/>
    <polygon points="-58,0 -14,-7 -22,0 -14,7"  fill="#4a2e0a" opacity="0.85"/>
    <polygon points="58,0  14,-7  22,0  14,7"    fill="#8b6428" opacity="0.85"/>

    <!-- Intercardinal points (medium) -->
    <g transform="rotate(45)">
      <polygon points="0,-44 -5,-12 0,-18 5,-12"  fill="#7a5428" opacity="0.75"/>
      <polygon points="0,44  -5,12  0,18  5,12"   fill="#7a5428" opacity="0.75"/>
      <polygon points="-44,0 -12,-5 -18,0 -12,5"  fill="#7a5428" opacity="0.75"/>
      <polygon points="44,0  12,-5  18,0  12,5"    fill="#7a5428" opacity="0.75"/>
    </g>

    <!-- 8 short tertiary points -->
    <g opacity="0.55" fill="#9a7038">
      <polygon points="0,-34 -3,-10 0,-14 3,-10" transform="rotate(22.5)"/>
      <polygon points="0,-34 -3,-10 0,-14 3,-10" transform="rotate(67.5)"/>
      <polygon points="0,-34 -3,-10 0,-14 3,-10" transform="rotate(112.5)"/>
      <polygon points="0,-34 -3,-10 0,-14 3,-10" transform="rotate(157.5)"/>
      <polygon points="0,-34 -3,-10 0,-14 3,-10" transform="rotate(202.5)"/>
      <polygon points="0,-34 -3,-10 0,-14 3,-10" transform="rotate(247.5)"/>
      <polygon points="0,-34 -3,-10 0,-14 3,-10" transform="rotate(292.5)"/>
      <polygon points="0,-34 -3,-10 0,-14 3,-10" transform="rotate(337.5)"/>
    </g>

    <!-- Center circles -->
    <circle cx="0" cy="0" r="16" fill="#dfc49a" stroke="#6b4c1e" stroke-width="1.2" opacity="0.9"/>
    <circle cx="0" cy="0" r="9"  fill="#c4a068" stroke="#6b4c1e" stroke-width="0.8" opacity="0.9"/>
    <circle cx="0" cy="0" r="4"  fill="#4a2e0a" opacity="0.9"/>

    <!-- Cardinal letters -->
    <g font-family="Georgia, 'Times New Roman', serif" font-weight="bold" fill="#3a2008" opacity="0.85" text-anchor="middle">
      <text x="0"   y="-72" font-size="13">N</text>
      <text x="0"   y="82"  font-size="12">S</text>
      <text x="-76" y="4"   font-size="12">W</text>
      <text x="76"  y="4"   font-size="12">E</text>
    </g>
  </g>

  <!-- Secondary compass rose (upper-right, smaller) -->
  <g transform="translate(1300,180) scale(0.6)">
    <circle cx="0" cy="0" r="68" fill="none" stroke="#6b4c1e" stroke-width="1.2" opacity="0.45"/>
    <polygon points="0,-58 -7,-14 0,-22 7,-14"  fill="#4a2e0a" opacity="0.6"/>
    <polygon points="0,58  -7,14  0,22  7,14"   fill="#8b6428" opacity="0.6"/>
    <polygon points="-58,0 -14,-7 -22,0 -14,7"  fill="#4a2e0a" opacity="0.6"/>
    <polygon points="58,0  14,-7  22,0  14,7"    fill="#8b6428" opacity="0.6"/>
    <g transform="rotate(45)" opacity="0.5" fill="#7a5428">
      <polygon points="0,-44 -5,-12 0,-18 5,-12"/>
      <polygon points="0,44  -5,12  0,18  5,12"/>
      <polygon points="-44,0 -12,-5 -18,0 -12,5"/>
      <polygon points="44,0  12,-5  18,0  12,5"/>
    </g>
    <circle cx="0" cy="0" r="16" fill="#dfc49a" stroke="#6b4c1e" stroke-width="1.2" opacity="0.7"/>
    <circle cx="0" cy="0" r="5"  fill="#4a2e0a" opacity="0.7"/>
    <text x="0" y="-72" font-family="Georgia,serif" font-weight="bold" font-size="13" fill="#3a2008" opacity="0.65" text-anchor="middle">N</text>
  </g>

  <!-- Decorative wind-line flourishes from compass rose -->
  <g stroke="#7a5428" stroke-width="0.5" fill="none" opacity="0.25">
    <line x1="210" y1="632" x2="210" y2="42"/>
    <line x1="210" y1="768" x2="210" y2="868"/>
    <line x1="142" y1="700" x2="42"  y2="700"/>
    <line x1="278" y1="700" x2="1400" y2="700"/>
    <!-- Diagonal rhumb lines from rose -->
    <line x1="161" y1="651" x2="42"  y2="532"/>
    <line x1="259" y1="651" x2="520" y2="392"/>
    <line x1="259" y1="749" x2="600" y2="870"/>
    <line x1="161" y1="749" x2="42"  y2="868"/>
  </g>
</svg>
